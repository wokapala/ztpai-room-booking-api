services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - roombooking-pgdata:/var/lib/postgresql/data

volumes:
  roombooking-pgdata:
